apiVersion: v2
name: dbmanager
description: KBM DBManager by Khorafi Business Machines — unified administration, monitoring, performance, security and backup for heterogeneous relational database fleets
type: application
# chart version follows the product version (released together)
version: 0.16.0
appVersion: "0.16.0"
kubeVersion: ">=1.27.0-0"
home: https://github.com/hbenabdalla/dbmanager
icon: https://raw.githubusercontent.com/hbenabdalla/dbmanager/main/frontend/public/icon-512.png
sources:
  - https://github.com/hbenabdalla/dbmanager
keywords: [database, monitoring, postgresql, mysql, mariadb, sql-server, oracle, db2, dba]
license: Apache-2.0
maintainers:
  - name: KBM DBManager maintainers (Khorafi Business Machines)
    url: https://github.com/hbenabdalla/dbmanager
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: database
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: Documentation
      url: https://db-manager.readthedocs.io/en/latest/
    - name: Helm guide
      url: https://db-manager.readthedocs.io/en/latest/deployment/kubernetes-helm/
    - name: Source
      url: https://github.com/hbenabdalla/dbmanager
    - name: Changelog
      url: https://github.com/hbenabdalla/dbmanager/blob/main/CHANGELOG.md
  # images Artifact Hub scans for vulnerabilities (keep in step with values.yaml and appVersion)
  artifacthub.io/images: |
    - name: dbmanager-backend
      image: ghcr.io/hbenabdalla/dbmanager-backend:0.16.0
    - name: dbmanager-frontend
      image: ghcr.io/hbenabdalla/dbmanager-frontend:0.16.0
    - name: postgresql
      image: postgres:16-alpine
    - name: victoriametrics
      image: victoriametrics/victoria-metrics:v1.122.0
