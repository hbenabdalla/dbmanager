{{- if .Values.networkPolicy.enabled }}
{{- range $component := list "postgresql" "timeseries" }}
{{- $enabled := ternary $.Values.postgresql.bundled.enabled $.Values.timeseries.bundled.enabled (eq $component "postgresql") }}
{{- if $enabled }}
---
# {{ $component }} accepts connections from the DBManager API and worker pods only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dbm.fullname" $ }}-{{ $component }}
  labels: {{- include "dbm.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "dbm.selector" (dict "ctx" $ "component" $component) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "dbm.selector" (dict "ctx" $ "component" "api") | nindent 14 }}
        - podSelector:
            matchLabels: {{- include "dbm.selector" (dict "ctx" $ "component" "worker") | nindent 14 }}
        {{- if eq $component "timeseries" }}
        - podSelector:
            matchLabels: {{- include "dbm.selector" (dict "ctx" $ "component" "test") | nindent 14 }}
        {{- end }}
      ports: [{ port: {{ ternary 5432 8428 (eq $component "postgresql") }} }]
{{- end }}
{{- end }}
---
# the API accepts connections from the frontend pods (and the chart's test pod) only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dbm.fullname" . }}-api
  labels: {{- include "dbm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "dbm.selector" (dict "ctx" $ "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "dbm.selector" (dict "ctx" $ "component" "frontend") | nindent 14 }}
        - podSelector:
            matchLabels: {{- include "dbm.selector" (dict "ctx" $ "component" "test") | nindent 14 }}
        {{- with .Values.networkPolicy.extraApiIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports: [{ port: 8000 }]
{{- end }}
