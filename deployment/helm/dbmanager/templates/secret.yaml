{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dbm.secretName" . }}
  labels: {{- include "dbm.labels" . | nindent 4 }}
  annotations:
    # losing DBM_MASTER_KEY makes every stored credential undecryptable: keep the Secret on uninstall
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  DBM_MASTER_KEY: {{ required "secrets.masterKey is required (base64 of 32 random bytes) unless secrets.existingSecret is set" $s.masterKey | quote }}
  DBM_TIMESERIES_PASSWORD: {{ required "secrets.timeseriesPassword is required unless secrets.existingSecret is set" $s.timeseriesPassword | quote }}
  {{- with $s.bootstrapAdminPassword }}
  DBM_BOOTSTRAP_ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- if .Values.postgresql.bundled.enabled }}
  {{- $pg := .Values.postgresql.bundled }}
  {{- $pw := required "secrets.postgresPassword is required for the bundled PostgreSQL unless secrets.existingSecret is set" $s.postgresPassword }}
  POSTGRES_PASSWORD: {{ $pw | quote }}
  DBM_DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@%s-postgresql:5432/%s" $pg.username $pw (include "dbm.fullname" .) $pg.database | quote }}
  {{- else }}
  DBM_DATABASE_URL: {{ required "secrets.databaseUrl is required with an external PostgreSQL unless secrets.existingSecret is set" $s.databaseUrl | quote }}
  {{- end }}
{{- end }}
