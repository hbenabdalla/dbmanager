{{- $c := dict "ctx" $ "component" "api" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dbm.fullname" . }}-api
  labels: {{- include "dbm.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels: {{- include "dbm.selector" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "dbm.selector" $c | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      annotations:
        checksum/config: {{ include "dbm.configChecksum" . }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      serviceAccountName: {{ include "dbm.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- include "dbm.podSecurity" (dict "ctx" $ "uid" 10001 "gid" 0) | nindent 8 }}
      {{- include "dbm.spread" (dict "ctx" $ "component" "api" "enabled" .Values.api.topologySpread) | nindent 6 }}
      containers:
        - name: api
          image: {{ include "dbm.image" (dict "ctx" $ "img" .Values.image.backend) }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          env:
            - { name: DBM_PROCESS_ROLE, value: api }
            {{- include "dbm.backendEnv" . | nindent 12 }}
          envFrom:
            - configMapRef: { name: {{ include "dbm.fullname" . }}-config }
          ports: [{ containerPort: 8000, name: http }]
          # start-up runs migrations (serialised across replicas): allow it time before liveness
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5, failureThreshold: 60 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20 }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- include "dbm.containerSecurity" . | nindent 12 }}
          volumeMounts: {{- include "dbm.backendVolumeMounts" . | nindent 12 }}
      volumes: {{- include "dbm.backendVolumes" . | nindent 8 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  # the frontend nginx proxies /api to this name (BACKEND_URL)
  name: {{ include "dbm.fullname" . }}-api
  labels: {{- include "dbm.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector: {{- include "dbm.selector" $c | nindent 4 }}
  ports: [{ port: 8000, targetPort: http, name: http }]
{{- if and .Values.api.podDisruptionBudget.enabled (or .Values.api.autoscaling.enabled (gt (int .Values.api.replicas) 1)) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "dbm.fullname" . }}-api
  labels: {{- include "dbm.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "dbm.selector" $c | nindent 6 }}
{{- end }}
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "dbm.fullname" . }}-api
  labels: {{- include "dbm.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "dbm.fullname" . }}-api }
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }} } }
{{- end }}
