{{- $c := dict "ctx" $ "component" "frontend" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dbm.fullname" . }}-frontend
  labels: {{- include "dbm.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: 5
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels: {{- include "dbm.selector" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "dbm.selector" $c | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "dbm.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- include "dbm.podSecurity" (dict "ctx" $ "uid" 101 "gid" 101) | nindent 8 }}
      containers:
        - name: web
          image: {{ include "dbm.image" (dict "ctx" $ "img" .Values.image.frontend) }}
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          env:
            - { name: BACKEND_URL, value: {{ printf "http://%s-api:8000" (include "dbm.fullname" .) | quote }} }
            - { name: DBM_OUTER_PROXY, value: {{ .Values.frontend.outerProxy | quote }} }
          ports: [{ containerPort: 8080, name: http }]
          readinessProbe: { httpGet: { path: /nginx-health, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /nginx-health, port: http }, periodSeconds: 20 }
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext: {{- include "dbm.containerSecurity" . | nindent 12 }}
          volumeMounts:
            # nginx renders its configuration from the template at start and keeps caches and its pid here
            - { name: conf, mountPath: /etc/nginx/conf.d }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: conf, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dbm.fullname" . }}
  labels: {{- include "dbm.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "dbm.selector" $c | nindent 4 }}
  ports: [{ port: {{ .Values.service.port }}, targetPort: http, name: http }]
{{- if and .Values.frontend.podDisruptionBudget.enabled (gt (int .Values.frontend.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "dbm.fullname" . }}-frontend
  labels: {{- include "dbm.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.frontend.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "dbm.selector" $c | nindent 6 }}
{{- end }}
