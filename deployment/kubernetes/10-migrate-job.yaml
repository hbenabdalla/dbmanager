apiVersion: batch/v1
kind: Job
metadata:
  name: dbmanager-migrate
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: registry.example.com/database-manager-backend:1.0.0
          command: ["sh", "-c", "python -m app.cli migrate && python -m app.cli bootstrap"]
          envFrom:
            - configMapRef: { name: dbmanager-config }
            - secretRef: { name: dbmanager-secrets }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
