apiVersion: batch/v1
kind: Job
metadata:
  name: dbmanager-migrate
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: ghcr.io/hbenabdalla/dbmanager-backend:0.15.3
          command: ["sh", "-c", "python -m app.cli migrate && python -m app.cli bootstrap"]
          envFrom:
            - configMapRef: { name: dbmanager-config }
            - secretRef: { name: dbmanager-secrets }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
