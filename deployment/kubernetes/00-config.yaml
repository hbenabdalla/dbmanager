# Reference manifests. Apply with:  kubectl apply -n dbmanager -f deployment/kubernetes/
# Secrets are NOT included: create "dbmanager-secrets" from your secret manager (External Secrets,
# Sealed Secrets, Vault Agent...) with keys DBM_DATABASE_URL, DBM_MASTER_KEY, DBM_BOOTSTRAP_ADMIN_PASSWORD,
# DBM_TIMESERIES_USERNAME, DBM_TIMESERIES_PASSWORD.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dbmanager-config
data:
  DBM_ENV: production
  DBM_PUBLIC_BASE_URL: https://dbmanager.example.com
  DBM_COOKIE_SECURE: "true"
  DBM_TRUSTED_PROXIES: "10.0.0.0/8"
  DBM_RUN_MIGRATIONS_ON_START: "false"     # run the migrate Job instead
  DBM_COLLECTOR_CONCURRENCY: "32"
  FORWARDED_ALLOW_IPS: "*"
  DBM_TIMESERIES_URL: http://timeseries:8428
  DBM_TIMESERIES_RETENTION: 90d
  DBM_METRIC_BATCH_SIZE: "2000"
  DBM_METRIC_FLUSH_INTERVAL: "5"
---
apiVersion: v1
kind: Secret
metadata:
  name: dbmanager-secrets
type: Opaque
stringData: {}   # populated by your secret operator; never commit values
