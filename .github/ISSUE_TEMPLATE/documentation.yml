name: Documentation
description: Missing, wrong or unclear documentation.
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: URL or path under docs/.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
