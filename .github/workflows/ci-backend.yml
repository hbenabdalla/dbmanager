name: Backend

on:
  # no path filter on pull requests: these checks are required by branch protection and
  # must always report (see CONTRIBUTING.md, "Branch protection")
  pull_request:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/ci-backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Backend lint
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install "ruff>=0.5"
      - run: ruff check .
      - run: ruff format --check app tests

  test:
    name: Backend tests
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dbm
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dbmanager_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dbm" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DBM_TEST_DATABASE_URL: postgresql+asyncpg://dbm:ci-only-password@localhost:5432/dbmanager_test
      # the real-engine suite runs against the PostgreSQL service too (MySQL/SQL Server/Oracle/Db2
      # need the dedicated integration workflow)
      DBM_IT_PG_HOST: localhost
      DBM_IT_PG_PORT: "5432"
      DBM_IT_PG_USER: dbm
      DBM_IT_PG_PASSWORD: ci-only-password
      DBM_IT_PG_DB: dbmanager_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - name: Install unixODBC (pyodbc wheel dependency)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unixodbc libxml2
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest tests/unit -q -rs
      - name: Serve TLS from the PostgreSQL service (control-plane TLS tests)
        run: |
          python tests/integration/tls/make_certs.py --dns-only /tmp/pgtls
          C="${{ job.services.postgres.id }}"
          docker cp /tmp/pgtls/server-cert.pem "$C":/var/lib/postgresql/server.crt
          docker cp /tmp/pgtls/server-key.pem "$C":/var/lib/postgresql/server.key
          docker exec "$C" sh -c "chown postgres /var/lib/postgresql/server.* && chmod 600 /var/lib/postgresql/server.key"
          docker exec -u postgres "$C" psql -U dbm -d dbmanager_test -c "ALTER SYSTEM SET ssl_cert_file = '/var/lib/postgresql/server.crt'" \
            -c "ALTER SYSTEM SET ssl_key_file = '/var/lib/postgresql/server.key'" -c "ALTER SYSTEM SET ssl = on" -c "SELECT pg_reload_conf()"
          echo "DBM_TEST_DATABASE_TLS_CA=/tmp/pgtls/ca.pem" >> "$GITHUB_ENV"
      - name: API tests
        run: pytest tests/api -q -rs
      - name: Migrations (step-by-step upgrade, downgrade, model parity) and backup/restore round trip
        run: pytest tests/migrations -q -rs
      - name: Enable pg_stat_statements for the PostgreSQL adapter suite
        run: |
          docker exec "${{ job.services.postgres.id }}" sh -c "echo \"shared_preload_libraries='pg_stat_statements'\" >> /var/lib/postgresql/data/postgresql.conf"
          docker restart "${{ job.services.postgres.id }}"
          for i in $(seq 1 30); do pg_isready -h localhost -U dbm && break; sleep 2; done
      - name: PostgreSQL adapter (real engine)
        run: pytest tests/integration -m postgresql -q -rs
