name: Documentation

on:
  pull_request:
    paths: ["docs/**", "mkdocs.yml", ".readthedocs.yaml", ".github/workflows/ci-docs.yml", "README.md"]
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".readthedocs.yaml", ".github/workflows/ci-docs.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: docs/requirements.txt }
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
