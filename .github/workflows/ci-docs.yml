name: Documentation

on:
  # no path filter on pull requests: these checks are required by branch protection and
  # must always report (see CONTRIBUTING.md, "Branch protection")
  pull_request:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".readthedocs.yaml", ".github/workflows/ci-docs.yml"]

permissions:
  contents: read

jobs:
  build:
    name: Documentation build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: docs/requirements.txt }
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
