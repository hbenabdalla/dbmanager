name: Docker images

on:
  pull_request:
    paths: ["backend/**", "frontend/**", "docker-compose.yml", ".github/workflows/ci-docker.yml"]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { name: backend, context: backend, target: runtime }
          - { name: frontend, context: frontend, target: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: false
          build-args: |
            DBM_BUILD_VERSION=${{ github.ref_name }}
            DBM_GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  compose:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: Generate .env
        run: ./scripts/init-env.sh
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Health
        run: |
          curl -fsS http://localhost:8080/healthz || (docker compose logs; exit 1)
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down -v
